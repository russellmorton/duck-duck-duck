<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A game for toddlers: steer a little duck down the river, miss the rocks and jump the ramps.">
<meta name="theme-color" content="#74c14d">
<title>Duck Duck Duck</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
/* Layout: the whole screen is the river (one canvas). The score, jumps and hearts float top left,
   two grown-up buttons top right, and a caption at the bottom shows whatever is being said.
   Single bright theme by choice, like Funny Fish. */
:root {
  --ink: #1d2b4f;
  --sun: #ffd23f;
  --font-display: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body {
  background: #74c14d;
  color: var(--ink);
  font-family: var(--font-display);
  overflow: hidden;
  overscroll-behavior: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

#river { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.hud {
  position: fixed; top: 0; left: 0; right: 0; z-index: 6;
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 0;
  pointer-events: none;
}
.hud > * { pointer-events: auto; }
.stats { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; pointer-events: none; }
body[data-state="title"] .stats { visibility: hidden; }
.pills { display: flex; gap: 8px; }
.pill {
  margin: 0; height: 48px; box-sizing: border-box; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,.9); border-radius: 999px; box-shadow: 0 3px 0 rgba(29,43,79,.18);
  font-weight: 800; font-size: 1.6rem; line-height: 1; font-variant-numeric: tabular-nums;
}
.pill svg { width: 28px; height: 28px; flex-shrink: 0; }
.hearts { display: flex; gap: 4px; margin: 0; padding: 0 0 0 4px; list-style: none; }
.hearts svg { width: 32px; height: 32px; display: block; filter: drop-shadow(0 2px 0 rgba(29,43,79,.25)); transition: transform .3s; }
.hearts li.lost svg { transform: scale(.8); }
.hearts li.lost path { fill: #d5dbe5; stroke: #8f9bb0; }
.btns { display: flex; gap: 8px; }
.icon-btn { width: 48px; height: 48px; flex-shrink: 0; border: 0; padding: 0; border-radius: 50%; background: rgba(255,255,255,.88); box-shadow: 0 3px 0 rgba(29,43,79,.18); display: grid; place-items: center; }
.icon-btn svg { width: 26px; height: 26px; }

.caption {
  position: fixed; z-index: 12; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); transform: translateX(-50%);
  margin: 0; width: max-content; max-width: calc(100% - 32px); box-sizing: border-box;
  background: rgba(255,255,255,.94); border-radius: 999px; padding: 4px 20px;
  font-weight: 800; font-size: clamp(1.05rem, 2.6vw, 1.45rem); line-height: 1.25; text-align: center; text-wrap: balance;
  box-shadow: 0 3px 0 rgba(29,43,79,.18); opacity: 0; transition: opacity .3s; pointer-events: none;
}
.caption.on { opacity: 1; }

/* title screen: tap anywhere to start (which also lets the browser play sound) */
.title {
  position: fixed; inset: 0; z-index: 5; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vh;
  background: radial-gradient(circle at 50% 45%, rgba(255,255,255,.45), rgba(255,255,255,0) 65%);
  touch-action: none;
}
.title h1 { margin: 0; font-size: clamp(2.6rem, min(17vw, 11vh), 6.5rem); font-weight: 800; line-height: .92; text-align: center; padding-inline: 16px; }
.title h1 .word { display: block; }
.title h1 .word:nth-child(2) { transform: translateX(-.4em) rotate(-3deg); }
.title h1 .word:nth-child(3) { transform: translateX(.4em) rotate(2deg); }
.title h1 .word span { display: inline-block; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 rgba(29,43,79,.35); animation: bob 2.4s ease-in-out infinite; animation-delay: calc(var(--i) * -.18s); }
.play {
  width: clamp(110px, 26vmin, 180px); aspect-ratio: 1; border-radius: 50%; border: 5px solid var(--ink); background: var(--sun);
  box-shadow: 0 8px 0 rgba(29,43,79,.35); display: grid; place-items: center; padding: 0; animation: pulse 1.6s ease-in-out infinite;
}
.play svg { width: 52%; height: 52%; }
#play svg { margin-left: 8%; }
.play:disabled { opacity: .5; animation: none; cursor: default; }
.title-best { margin: 0; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.9); border-radius: 999px; padding: 2px 16px 2px 10px; font-weight: 800; font-size: 1.3rem; box-shadow: 0 3px 0 rgba(29,43,79,.18); }
.title-best svg { width: 24px; height: 24px; }

/* the score card at the end of a swim */
.results { position: fixed; inset: 0; z-index: 10; background: rgba(8,40,30,.45); display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
.card {
  background: #fffaf0; border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 rgba(0,0,0,.25);
  width: 100%; max-width: 420px; max-height: 100%; overflow: auto; box-sizing: border-box; padding: 14px 20px 22px;
  display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; animation: pop .45s cubic-bezier(.3,1.6,.5,1);
}
.card h2 { margin: 0; font-size: 2.2rem; font-weight: 800; line-height: 1.1; }
.final { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 3.6rem; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.final svg { width: 52px; height: 52px; }
.new-best { margin: 0; background: #ff6b9d; color: #fff; border-radius: 999px; padding: 0 14px; font-weight: 800; font-size: 1.2rem; animation: wiggle .6s ease 3; }
.facts { display: flex; gap: 18px; margin: 4px 0; padding: 0; list-style: none; font-size: 1.4rem; font-weight: 800; }
.facts li { display: flex; align-items: center; gap: 6px; }
.facts svg { width: 30px; height: 30px; }
.best-line { margin: 0 0 8px; color: #5b6782; font-weight: 600; font-size: 1.1rem; }

@keyframes pop { from { transform: scale(.3) } }
@keyframes bob { 50% { transform: translateY(-10%) rotate(-4deg) } }
@keyframes pulse { 50% { transform: scale(1.08) } }
@keyframes wiggle { 25% { transform: rotate(-6deg) } 75% { transform: rotate(6deg) } }

@media (max-width: 560px) {
  .pills, .btns { gap: 6px; }
  .pill { height: 40px; font-size: 1.3rem; padding: 0 12px 0 8px; }
  .pill svg { width: 24px; height: 24px; }
  .hearts svg { width: 28px; height: 28px; }
  .icon-btn { width: 40px; height: 40px; }
  .icon-btn svg { width: 22px; height: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .title h1 .word span, .play, .card, .new-best { animation: none !important; }
}
</style>
</head>
<body>
<canvas id="river" role="img" aria-label="A little duck swimming down a river" tabindex="0"></canvas>

<header class="hud">
  <div class="stats">
    <div class="pills">
      <p class="pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#ffd23f" stroke="#1d2b4f" stroke-width="2" stroke-linejoin="round"/></svg>
        <span class="sr">Score</span> <span id="score">0</span>
      </p>
      <p class="pill">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h20V7z" fill="#ffb347" stroke="#1d2b4f" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 20v-4M15 20v-7.5" stroke="#d98a2b" stroke-width="2"/></svg>
        <span class="sr">Jumps</span> <span id="jumps">0</span>
      </p>
    </div>
    <ol class="hearts" id="hearts" aria-label="3 hearts left">
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8 3.6 4.5 7 4.5c2 0 3.8 1.2 5 3 1.2-1.8 3-3 5-3 3.4 0 6 3.5 4.5 7.3C19.5 16.4 12 21 12 21z" fill="#ff5a6e" stroke="#1d2b4f" stroke-width="2" stroke-linejoin="round"/></svg></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8 3.6 4.5 7 4.5c2 0 3.8 1.2 5 3 1.2-1.8 3-3 5-3 3.4 0 6 3.5 4.5 7.3C19.5 16.4 12 21 12 21z" fill="#ff5a6e" stroke="#1d2b4f" stroke-width="2" stroke-linejoin="round"/></svg></li>
      <li><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.5-9.2C1 8 3.6 4.5 7 4.5c2 0 3.8 1.2 5 3 1.2-1.8 3-3 5-3 3.4 0 6 3.5 4.5 7.3C19.5 16.4 12 21 12 21z" fill="#ff5a6e" stroke="#1d2b4f" stroke-width="2" stroke-linejoin="round"/></svg></li>
    </ol>
  </div>
  <div class="btns">
    <button class="icon-btn" id="mute" aria-label="Sound on" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
    </button>
    <button class="icon-btn" id="full" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<p class="caption" id="caption" aria-live="polite"></p>

<div class="title" id="title-screen">
  <h1 id="title" aria-label="Duck Duck Duck"></h1>
  <button class="play" id="play" aria-label="Play">
    <svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#1d2b4f" stroke="#1d2b4f" stroke-width="2" stroke-linejoin="round"/></svg>
  </button>
  <p class="title-best" id="title-best" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#ffd23f" stroke="#1d2b4f" stroke-width="2" stroke-linejoin="round"/></svg>
    Best <span id="title-best-n"></span>
  </p>
</div>

<div class="results" id="results" role="dialog" aria-modal="true" aria-labelledby="results-title" hidden>
  <div class="card">
    <h2 id="results-title">Hooray!</h2>
    <p class="final">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="#ffd23f" stroke="#1d2b4f" stroke-width="2" stroke-linejoin="round"/></svg>
      <span class="sr">Score</span> <span id="final">0</span>
    </p>
    <p class="new-best" id="new-best" hidden>New best!</p>
    <ul class="facts">
      <li>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V3" stroke="#1d2b4f" stroke-width="2.6" stroke-linecap="round"/><path d="M6 4h12l-3 4 3 4H6z" fill="#ff6b6b" stroke="#1d2b4f" stroke-width="2" stroke-linejoin="round"/></svg>
        <span class="sr">Distance</span> <span id="final-m">0 m</span>
      </li>
      <li>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 20h20V7z" fill="#ffb347" stroke="#1d2b4f" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 20v-4M15 20v-7.5" stroke="#d98a2b" stroke-width="2"/></svg>
        <span id="final-j">0 jumps</span>
      </li>
    </ul>
    <p class="best-line">Best <span id="best">0</span></p>
    <button class="play" id="again" aria-label="Play again">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1d2b4f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 13a7.5 7.5 0 1 1-2.2-6.3"/><path d="M18 2.5v5h-5"/></svg>
    </button>
  </div>
</div>

<script type="module" src="src/game.js"></script>
<script type="module" src="src/analytics.js"></script>
</body>
</html>
